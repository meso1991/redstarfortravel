<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيانات المسافرين - RedStar Travel</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .details-container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn-next { width: 100%; background: #e74c3c; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 20px; }
        .pd-lang-switcher { max-width: 600px; margin: 15px auto 0; display: flex; justify-content: flex-end; gap: 8px; }
        .pd-lang-switcher .lang-btn { border: 1px solid #ddd; background: #fff; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: bold; }
        .pd-lang-switcher .lang-btn.active { background: #e74c3c; color: #fff; border-color: #e74c3c; }
    </style>
</head>
<body>
    <div class="pd-lang-switcher">
        <button class="lang-btn" type="button" data-lang="en">EN</button>
        <button class="lang-btn" type="button" data-lang="ar">AR</button>
    </div>
    <div class="details-container">
        <h2 style="color: #e74c3c;" data-i18n="pd_heading">بيانات المسافر الرئيسي</h2>
        <hr>
        <form action="payment-demo.html">
            <div class="form-group">
                <label data-i18n="pd_label_name">الاسم بالكامل (كما في جواز السفر)</label>
                <input type="text" placeholder="مثلاً: محمد أحمد علي" data-i18n-placeholder="pd_placeholder_name" required>
            </div>
            <div class="form-group">
                <label data-i18n="pd_label_passport">رقم جواز السفر</label>
                <input type="text" placeholder="P000000" required>
            </div>
            <div class="form-group">
                <label data-i18n="pd_label_phone">رقم الهاتف (واتساب)</label>
                <input type="tel" placeholder="09XXXXXXXX" required>
            </div>
            <div class="form-group">
                <label data-i18n="pd_label_email">البريد الإلكتروني</label>
                <input type="email" placeholder="email@example.com" required>
            </div>
            <button type="submit" class="btn-next" data-i18n="pd_btn_next">الانتقال لتأكيد الدفع</button>
        </form>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
