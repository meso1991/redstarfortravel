name: Update Knowledge Base

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: انتظار اكتمال نشر الموقع (احتياطي)
        run: sleep 90

      - name: Run scraper
        run: python scrape_site.py

      - name: Commit updated knowledge base
        run: |
          git config user.name "redstar-bot"
          git config user.email "bot@redstar-travel.com"
          git add knowledge_base.json
          git diff --staged --quiet || git commit -m "تحديث تلقائي لقاعدة المعرفة"
          git push
