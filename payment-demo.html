<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة دفع ريد ستار - RedStar Payment</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .payment-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .bankak-logo { width: 150px; margin-bottom: 20px; }
        .amount { font-size: 24px; color: #e74c3c; font-weight: bold; margin: 20px 0; }
        .btn-confirm { background-color: #2ecc71; color: white; border: none; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-size: 18px; width: 100%; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #2ecc71; border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; display: none; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .pay-lang-switcher { width: 100%; max-width: 400px; display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 12px; }
        .pay-lang-switcher .lang-btn { border: 1px solid #ddd; background: #fff; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: bold; }
        .pay-lang-switcher .lang-btn.active { background: #e74c3c; color: #fff; border-color: #e74c3c; }
    </style>
</head>
<body>
    <div class="pay-lang-switcher">
        <button class="lang-btn" type="button" data-lang="en">EN</button>
        <button class="lang-btn" type="button" data-lang="ar">AR</button>
    </div>
    <div class="payment-card" id="paymentBox">
        <h2 data-i18n="pay_heading">إتمام الدفع عبر بنكك</h2>
        <p data-i18n="pay_instruction">الرجاء تحويل المبلغ إلى حساب وكالة ريد ستار</p>
        <div class="amount"><span data-i18n="pay_total_label">إجمالي</span>: 750,000 SDG</div>
        <input type="text" placeholder="أدخل رقم المرجع (Reference Number)" data-i18n-placeholder="pay_placeholder_ref" style="width: 90%; padding: 10px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 5px;">
        <div class="loader" id="loader"></div>
        <button class="btn-confirm" data-i18n="pay_btn_confirm" onclick="processPayment()">تأكيد عملية التحويل</button>
    </div>

    <script src="js/main.js"></script>
    <script>
        const paymentSuccessText = {
            ar: {
                heading: "✅ تم الحجز بنجاح",
                ticketLabel: "رقم التذكرة",
                note: "سيتم إرسال التذكرة إلى بريدك الإلكتروني فوراً.",
                home: "العودة للرئيسية"
            },
            en: {
                heading: "✅ Booking Confirmed",
                ticketLabel: "Ticket Number",
                note: "The ticket will be sent to your email shortly.",
                home: "Back to Home"
            }
        };

        function processPayment() {
            document.getElementById('loader').style.display = 'block';
            document.querySelector('.btn-confirm').disabled = true;
            setTimeout(() => {
                const lang = localStorage.getItem('redstar_lang') || 'ar';
                const t = paymentSuccessText[lang] || paymentSuccessText.ar;
                document.getElementById('paymentBox').innerHTML = `
                    <h2 style="color: #2ecc71;">${t.heading}</h2>
                    <p>${t.ticketLabel}: <strong>RS-789-2026</strong></p>
                    <p>${t.note}</p>
                    <button onclick="window.location.href='index.html'" style="margin-top:20px; padding:10px; cursor:pointer;">${t.home}</button>
                `;
            }, 3000);
        }
    </script>
</body>
</html>
